name: Setup
description: Install Node, restore caches, install npm dependencies if needed

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: npm

    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    - if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci

    - name: Restore turbo cache
      uses: actions/cache@v4
      with:
        path: |
          .turbo
          apps/*/.turbo
          realms/*/.turbo
          packages/*/.turbo
          tools/*/.turbo
        key: turbo-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-
