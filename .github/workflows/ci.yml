name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

  lint:
    name: Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Check
        run: pnpm run check:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Test
        run: npx turbo test:unit test:flow

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Check workspace READMEs
        run: npx turbo run docs -- --check

      - name: Check root index READMEs
        run: ./tools/poe/bin/poe index --check realms tools packages apps

  test-api:
    name: API Tests (${{ matrix.realm }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        realm: [citizen, codex, universe]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: API Tests
        run: npx turbo test:api --filter=${{ matrix.realm }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ matrix.realm }}
