name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm run build

  check:
    name: Check
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Check
        run: pnpm run check:ci

      - name: Check workspace READMEs
        if: always()
        run: npx turbo run docs -- --check

      - name: Check root index READMEs
        if: always()
        run: ./tools/poe/bin/poe index --check realms tools packages apps

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Unit + Flow
        run: npx turbo test:unit test:flow

      - name: API Tests (citizen)
        if: always()
        run: npx turbo test:api --filter=citizen
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/citizen

      - name: API Tests (codex)
        if: always()
        run: npx turbo test:api --filter=codex
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codex

      - name: API Tests (universe)
        if: always()
        run: npx turbo test:api --filter=universe
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/universe
